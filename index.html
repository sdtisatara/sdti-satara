<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDTI Satara - Smart Attendance & Task System</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/19kopqfzWax1nSnGhIJjNPmziaBdr-1eU" type="image/png">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0f4f8; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="geolocation *; camera *; microphone *"></iframe>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPxvjvevzSTyseP7ovMPuxfOYFKfumSNAsSMGNn6LEOFEr6Q516eQx60GXG34FIoU/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const qrClass = urlParams.get('qrClass');
    const mode = urlParams.get('mode');

    let targetUrl = SCRIPT_URL;
    if (qrClass) {
      targetUrl += "?qrClass=" + encodeURIComponent(qrClass).replace(/\(/g, '%28').replace(/\)/g, '%29');
    } else if (mode) {
      targetUrl += "?mode=" + encodeURIComponent(mode);
    }
    document.getElementById('appFrame').src = targetUrl;
  </script>
</body>
</html>
